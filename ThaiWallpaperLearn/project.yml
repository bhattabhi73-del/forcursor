# XcodeGen spec — a backup way to (re)generate the Xcode project.
#
# You normally do NOT need this: just open ThaiWallpaperLearn.xcodeproj.
# But if the project ever won't open, install XcodeGen and regenerate:
#
#     brew install xcodegen
#     cd ThaiWallpaperLearn
#     xcodegen generate
#
name: ThaiWallpaperLearn
options:
  bundleIdPrefix: com.thailearn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  ThaiWallpaperLearn:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thailearn.ThaiWallpaperLearn
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thai Learn
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ThaiWidgetExtension

  ThaiWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thailearn.ThaiWallpaperLearn.ThaiWidget
        INFOPLIST_FILE: Widget/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Thai Learn
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
