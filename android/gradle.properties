# Tuned for an 8 GB machine. -Xmx3g put the Gradle daemon alone at the point
# where the VM compressor started thrashing; the Kotlin daemon then stacks on
# top of it. Together these keep the toolchain under ~2.5 GB resident, which is
# also below the ceilings ~/bin/memguard.sh enforces. Raise both if this ever
# builds on a bigger machine.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true
kotlin.code.style=official
