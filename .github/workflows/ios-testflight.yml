name: iOS TestFlight

# Builds the SwiftUI app on a macOS cloud runner and uploads to TestFlight.
# Windows cannot compile iOS — this workflow is how we ship it "from here".
#
# Trigger: manually (Actions tab → Run workflow) or on push to the working branch.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID        = R7DDSVPMLD
#   ASC_ISSUER_ID     = 7bf665d8-f314-48de-bad3-9d988012de09
#   ASC_KEY_P8_BASE64 = base64 of the AuthKey_R7DDSVPMLD.p8 file
#                       (macOS/Linux: base64 -i AuthKey_R7DDSVPMLD.p8 | pbcopy)
# Never paste the .p8 contents into chat or commit them — add them only as secrets.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/thai-learning-iphone-app-6ua1iz

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ThaiWallpaperLearn
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          test -s ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 || { echo "::error::Decoded .p8 is empty — check ASC_KEY_P8_BASE64 secret"; exit 1; }

      - name: Archive (unsigned)
        run: |
          xcodebuild \
            -project ThaiWallpaperLearn.xcodeproj \
            -scheme ThaiWallpaperLearn \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ThaiWallpaperLearn.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Export signed IPA (App Store Connect, cloud signing)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ThaiWallpaperLearn.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThaiWallpaperLearn-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
